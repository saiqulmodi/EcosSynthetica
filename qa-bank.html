<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecos-Synthetica | Q/A Learning Bank</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      background: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header-bar {
      max-width: 900px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 18px;
    }
    .header-title h1 { margin: 0; font-size: 24px; color: #f8fafc; }
    .header-title p { margin: 6px 0 0; color: #94a3b8; font-size: 14px; }
    .btn-action {
      padding: 10px 18px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #0369a1; }
    .qa-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .qa-card {
      background: #141c2e;
      border: 1px solid #24324d;
      border-radius: 10px;
      padding: 20px;
    }
    .qa-stage {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .qa-question {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .qa-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .qa-option {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
    }
    .qa-option.correct {
      background: rgba(34, 197, 94, 0.12);
      border-color: #22c55e;
      color: #4ade80;
      font-weight: 600;
    }
    .qa-explanation {
      font-size: 13px;
      color: #cbd5e1;
      border-left: 3px solid #38bdf8;
      padding-left: 12px;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-title">
      <h1>?? Core Curriculum & Q/A Bank</h1>
      <p>Study concepts and question structures before entering simulation stages.</p>
    </div>
    <a href="index.html" class="btn-action">? Return to Simulation</a>
  </div>

  <div id="qaContainer" class="qa-container">
    <p style="color: #94a3b8;">Loading knowledge bank...</p>
  </div>

  <script>
    async function loadQABank() {
      const container = document.getElementById('qaContainer');
      try {
        const res = await fetch('./questions.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const stages = data.stages || [];
        container.innerHTML = stages.flatMap(s =>
          s.questions.map(q => `
            <div class="qa-card">
              <div class="qa-stage">${s.title} • ${q.pillar}</div>
              <div class="qa-question">${q.prompt}</div>
              <div class="qa-options">
                ${q.options.map((opt, i) => `
                  <div class="qa-option ${i === q.correctIndex ? 'correct' : ''}">
                    ${i === q.correctIndex ? '? ' : '• '} ${opt}
                  </div>
                `).join('')}
              </div>
              <div class="qa-explanation"><em>${q.explanation}</em></div>
            </div>
          `)
        ).join('');
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">Failed to load questions: ${err.message}</p>`;
      }
    }
    loadQABank();
  </script>
</body>
</html>
