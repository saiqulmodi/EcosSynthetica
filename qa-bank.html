<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecos-Synthetica | Q/A Learning Bank</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      background: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header-bar {
      max-width: 900px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    .header-title h1 { margin: 0; font-size: 24px; color: #f8fafc; }
    .header-title p { margin: 4px 0 0; color: #94a3b8; font-size: 14px; }
    .btn-action {
      padding: 8px 16px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .qa-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .qa-card {
      background: #141c2e;
      border: 1px solid #24324d;
      border-radius: 10px;
      padding: 20px;
    }
    .qa-stage {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .qa-question {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .qa-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .qa-option {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
    }
    .qa-option.correct {
      background: rgba(34, 197, 94, 0.12);
      border-color: #22c55e;
      color: #4ade80;
      font-weight: 600;
    }
    .qa-explanation {
      font-size: 13px;
      color: #cbd5e1;
      border-left: 3px solid #38bdf8;
      padding-left: 12px;
      margin-top: 10px;
    }
    .pagination-bar {
      max-width: 900px;
      margin: 24px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid #1e293b;
    }
    .btn-nav {
      padding: 10px 20px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-info {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-title">
      <h1>Core Curriculum & Q/A Bank</h1>
      <p>Study concepts in batches before starting simulation stages.</p>
    </div>
    <a href="index.html" class="btn-action">Back to Simulation</a>
  </div>

  <div id="qaContainer" class="qa-container">
    <p style="color: #94a3b8;">Loading knowledge bank...</p>
  </div>

  <div class="pagination-bar">
    <button id="btnPrev" class="btn-nav" onclick="changeBatch(-1)" disabled>Previous Batch</button>
    <span id="batchInfo" class="page-info">Batch 1</span>
    <button id="btnNext" class="btn-nav" onclick="changeBatch(1)">Next Batch</button>
  </div>

  <script>
    // The 5 questions added on 28-Oct, in the same shape as questions.json.
    const extraQuestions = [
      {
        stageTitle: "Wolf Pack",
        pillar: "Trophic Dynamics",
        prompt: "How does apex predator predation regulate lower trophic biomass?",
        options: [
          "Top-down suppression of herbivore overgrazing",
          "Direct nutrient injection into soil horizons",
          "Suppression of primary solar capture",
          "Elimination of primary decomposer bacteria"
        ],
        correctIndex: 0,
        explanation: "Apex carnivores initiate trophic cascades that limit herbivore density and restore vegetation cover."
      },
      {
        stageTitle: "Decomposer",
        pillar: "Mineral Cycling",
        prompt: "What biochemical role do saprophytic microbes serve in soil ecology?",
        options: [
          "Enzymatic breakdown of organic polymers into inorganic ions",
          "Direct conversion of light into fixed carbon",
          "Locking atmospheric nitrogen permanently into bedrock",
          "Thermal sterilization of rhizosphere pathogens"
        ],
        correctIndex: 0,
        explanation: "Saprophytes mineralize dead organic substrates, re-releasing soluble N, P, and K into the soil solution."
      },
      {
        stageTitle: "Plant Seedling",
        pillar: "Nutrient Uptake",
        prompt: "Which root zone transport process moves mineral ions against their concentration gradient?",
        options: [
          "Active transport powered by ATP hydrolysis via proton pumps",
          "Simple diffusion through cuticular wax layers",
          "Passive bulk flow through dead xylem tracheids",
          "Suberin membrane osmosis"
        ],
        correctIndex: 0,
        explanation: "Proton ATPase pumps create an electrochemical gradient driving active secondary symport of mineral ions."
      },
      {
        stageTitle: "Honey Bee",
        pillar: "Ecological Interaction",
        prompt: "In floral fidelity, how does pollinator consistency benefit the plant community?",
        options: [
          "Maximizes conspecific pollen transfer while minimizing gamete loss",
          "Accelerates nectar depletion to starve competitor insects",
          "Induces rapid somatic polyploidy in floral petals",
          "Prevents root mycorrhizae from absorbing nitrogen"
        ],
        correctIndex: 0,
        explanation: "Flower constancy prevents heterospecific pollen clogging, ensuring high fertilization efficiency."
      },
      {
        stageTitle: "Canopy Forest",
        pillar: "Light Attenuation",
        prompt: "How do understory shade-tolerant plants adapt physiologically to low photosynthetic photon flux?",
        options: [
          "Lower light compensation point with high chlorophyll b to a ratio",
          "Complete suppression of rubisco oxygenase activity",
          "Production of thick, multi-layered cuticular epidermis",
          "Direct conversion of thermal infrared into sucrose"
        ],
        correctIndex: 0,
        explanation: "Understory plants invest in broader antenna complexes with higher chlorophyll b to harvest diffuse blue and red wavelengths."
      }
    ];

    // The game's question bank: Explorer class packs and Scientist form packs
    // (same files js/Quiz.js and the tiers load).
    const bankFiles = [
      ...Array.from({ length: 10 }, (_, i) => `content/questions/explorer/class-${i + 1}.json`),
      ...Array.from({ length: 4 }, (_, i) => `content/questions/scientist/form-${i}.json`)
    ];

    let allQuestions = [];
    let currentBatch = 0;
    const batchSize = 3; // Shows 3 questions per batch

    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(url + ' HTTP ' + res.status);
      return res.json();
    }

    async function loadQABank() {
      try {
        const stageData = await getJSON('./questions.json').catch(() => ({ stages: [] }));
        const gameQuestions = (stageData.stages || []).flatMap(s =>
          (s.questions || []).map(q => ({ ...q, stageTitle: s.title }))
        );

        const packs = await Promise.all(bankFiles.map(f => getJSON(f).catch(() => [])));
        const bankQuestions = packs.flat().map(q => ({
          stageTitle: 'Class ' + q.cls + ' ' + (q.subject || ''),
          pillar: q.topic || '',
          prompt: q.q,
          options: q.opts || [],
          correctIndex: q.ans,
          explanation: q.why || ''
        }));

        allQuestions = [...gameQuestions, ...extraQuestions, ...bankQuestions];
        if (!allQuestions.length) throw new Error('No questions found. Open the game through serve.py or GitHub Pages, not as a file.');
        renderCurrentBatch();
      } catch (err) {
        document.getElementById('qaContainer').innerHTML = '<p style="color:#ef4444;">Error: ' + esc(err.message) + '</p>';
      }
    }

    function renderCurrentBatch() {
      const container = document.getElementById('qaContainer');
      const start = currentBatch * batchSize;
      const end = start + batchSize;
      const currentList = allQuestions.slice(start, end);
      const totalBatches = Math.ceil(allQuestions.length / batchSize) || 1;

      container.innerHTML = currentList.map(q => `
        <div class="qa-card">
          <div class="qa-stage">${esc(q.stageTitle)} • ${esc(q.pillar)}</div>
          <div class="qa-question">${esc(q.prompt)}</div>
          <div class="qa-options">
            ${q.options.map((opt, i) => `
              <div class="qa-option ${i === q.correctIndex ? 'correct' : ''}">
                ${i === q.correctIndex ? '✓ ' : '• '} ${esc(opt)}
              </div>
            `).join('')}
          </div>
          <div class="qa-explanation"><em>${esc(q.explanation)}</em></div>
        </div>
      `).join('');

      document.getElementById('batchInfo').innerText = `Batch ${currentBatch + 1} of ${totalBatches} (${allQuestions.length} Total Questions)`;
      document.getElementById('btnPrev').disabled = currentBatch === 0;
      document.getElementById('btnNext').disabled = end >= allQuestions.length;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeBatch(direction) {
      currentBatch += direction;
      renderCurrentBatch();
    }

    loadQABank();
  </script>
</body>
</html>
